name: Security Agent Scan
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for diff-based scanning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run Security Agent
        uses: ./  # Use local action (or replace with your-org/security-agent@v1)
        id: scan
        with:
          severity-threshold: 'HIGH'
          scan-mode: 'diff-only'
          fail-on-findings: 'true'
          sarif-output: 'security-results.sarif'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Upload SARIF to GitHub Code Scanning
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-results.sarif
        continue-on-error: true

      # Optional: Display scan summary
      - name: Scan Summary
        if: always()
        run: |
          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Score:** ${{ steps.scan.outputs.score }}/100" >> $GITHUB_STEP_SUMMARY
          echo "- **Risk Level:** ${{ steps.scan.outputs.risk-level }}" >> $GITHUB_STEP_SUMMARY
          echo "- **HIGH:** ${{ steps.scan.outputs.high-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **MEDIUM:** ${{ steps.scan.outputs.medium-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **LOW:** ${{ steps.scan.outputs.low-count }}" >> $GITHUB_STEP_SUMMARY
